services:
  admin:
    container_name: football-coach-admin
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* values are baked into the client bundle at build time.
      # Change them in `.env.local` and rebuild
      # (`docker compose up -d --build admin`).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.coaching-center.uz/v1}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    image: football-coach-admin:latest
    restart: unless-stopped
    # Single PORT env var controls both the host port AND the Next.js server
    # port inside the container — no double mapping, no surprises.
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      HOSTNAME: 0.0.0.0
      # Server-side runtime env (also exposed to the client because of the
      # NEXT_PUBLIC_ prefix — kept here for completeness / SSR consistency).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.coaching-center.uz/v1}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    # Container reads runtime env from `.env` (compose default, server use).
    # `.env.local` is the Next.js dev convention — symlink/copy to `.env` on
    # the server, or pass `--env-file=.env.local` to compose commands.
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:'+ (process.env.PORT||3000) +'/login').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Uncomment to attach to an existing backend network so the admin container
    # can reach the API by service name (e.g. `http://api:4021/v1`):
    # networks:
    #   - football-coach
# networks:
#   football-coach:
#     external: true
